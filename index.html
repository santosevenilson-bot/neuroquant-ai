<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroQuant PRO</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}
h1{
    text-align:center;
    color:#00ffcc;
}
select{
    padding:10px;
    margin-bottom:20px;
    width:100%;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    margin-top:20px;
}
.buy{color:#00ff88;font-weight:bold;}
.sell{color:#ff4d4d;font-weight:bold;}
.neutral{color:#ffaa00;font-weight:bold;}
.low{color:#00ff88;}
.medium{color:#ffaa00;}
.high{color:#ff4d4d;}
</style>
</head>

<body>

<h1>NeuroQuant AI</h1>

<select id="pairSelect"></select>

<div class="card">
    <h3>Sinais</h3>
    <p>Preço: <span id="price">--</span></p>
    <p>Tendência: <span id="trend">--</span></p>
    <p>Sinal: <span id="signal">--</span></p>
</div>

<div class="card">
    <h3>Detector de Crise</h3>
    <p>BTC: <span id="btcVar">--</span></p>
    <p>Ouro (PAXG): <span id="goldVar">--</span></p>
    <p>Risco: <span id="risk">--</span></p>
</div>

<script>

const pairSelect = document.getElementById("pairSelect");

document.addEventListener("DOMContentLoaded", () => {
    loadPairs();
    analyzeAll();
    setInterval(analyzeAll, 30000);
});

async function loadPairs(){
    try{
        const res = await fetch("https://api.binance.com/api/v3/exchangeInfo");
        const data = await res.json();

        const pairs = data.symbols
            .filter(s => s.quoteAsset === "USDT" && s.status === "TRADING")
            .map(s => s.symbol);

        pairs.forEach(pair=>{
            const opt = document.createElement("option");
            opt.value = pair;
            opt.textContent = pair;
            pairSelect.appendChild(opt);
        });

    }catch(e){
        console.log("Erro ao carregar pares", e);
    }
}

async function analyzeAll(){
    analyzeSignal();
    analyzeCrisis();
}

async function analyzeSignal(){
    const pair = pairSelect.value;
    if(!pair) return;

    try{
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=15m&limit=100`);
        const data = await res.json();

        const closes = data.map(c => parseFloat(c[4]));
        const price = closes.at(-1);

        document.getElementById("price").innerText = price.toFixed(4);

        const ema9 = EMA(closes,9);
        const ema21 = EMA(closes,21);
        const rsi = RSI(closes,14);

        let trend, signal;

        if(ema9 > ema21 && rsi > 55){
            trend="Alta";
            signal=`<span class="buy">COMPRA</span>`;
        } else if(ema9 < ema21 && rsi < 45){
            trend="Baixa";
            signal=`<span class="sell">VENDA</span>`;
        } else {
            trend="Neutro";
            signal=`<span class="neutral">AGUARDE</span>`;
        }

        document.getElementById("trend").innerText = trend;
        document.getElementById("signal").innerHTML = signal;

    }catch(e){
        console.log("Erro análise", e);
    }
}

function EMA(data, period){
    const k = 2/(period+1);
    let ema = data[0];
    for(let i=1;i<data.length;i++){
        ema = data[i]*k + ema*(1-k);
    }
    return ema;
}

function RSI(data, period){
    let gains=0, losses=0;

    for(let i=data.length-period;i<data.length-1;i++){
        const diff = data[i+1]-data[i];
        if(diff>0) gains+=diff;
        else losses+=Math.abs(diff);
    }

    if(losses === 0) return 100;
    const rs = gains/losses;
    return 100 - (100/(1+rs));
}

async function getVariation(symbol){
    try{
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=2`);
        const data = await res.json();

        const prev = parseFloat(data[0][4]);
        const last = parseFloat(data[1][4]);

        return ((last-prev)/prev)*100;

    }catch{
        return 0;
    }
}

async function analyzeCrisis(){

    // PAXG = ouro tokenizado (substitui XAU)
    const btc = await getVariation("BTCUSDT");
    const gold = await getVariation("PAXGUSDT");

    document.getElementById("btcVar").innerText = btc.toFixed(2)+"%";
    document.getElementById("goldVar").innerText = gold.toFixed(2)+"%";

    let risk = "Baixo";

    if(btc < -1 && gold > 0.5){
        risk = `<span class="medium">Médio</span>`;
    }
    if(btc < -2 && gold > 1){
        risk = `<span class="high">ALTO</span>`;
    }

    document.getElementById("risk").innerHTML = risk;
}

pairSelect.addEventListener("change", analyzeSignal);

</script>

</body>
</html>
