<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroQuant PRO Advanced</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
}

/* BOTÃO MENU */
.menu-btn{
    position:fixed;
    top:15px;
    left:15px;
    background:#00ffcc;
    color:#000;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    z-index:1000;
    font-weight:bold;
}

/* SIDEBAR OCULTO */
.sidebar{
    position:fixed;
    top:0;
    left:-250px;
    width:250px;
    height:100%;
    background:#020617;
    padding:20px;
    transition:0.3s;
    z-index:999;
}

.sidebar.active{
    left:0;
}

.menu-item{
    padding:12px;
    margin:10px 0;
    background:#1e293b;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
}
.menu-item:hover{background:#334155;}

.main{
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.hidden{display:none;}

.buy{color:#00ff88;font-weight:bold;}
.sell{color:#ff4d4d;font-weight:bold;}
.neutral{color:#ffaa00;font-weight:bold;}
.score{font-size:22px;margin-top:10px;}
</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">☰ Menu</div>

<div class="sidebar" id="sidebar">
    <div class="menu-item" onclick="showTab('signals')">📊 Sinais</div>
    <div class="menu-item" onclick="showTab('chart')">📈 Gráfico</div>
    <div class="menu-item" onclick="showTab('macro')">🌍 Macro</div>
</div>

<div class="main">

<!-- SINAIS -->
<div id="signals" class="tab">
    <div class="card">
        <h3>Sinal Inteligente</h3>
        <select id="pair"></select>
        <p>Preço: <span id="price">--</span></p>
        <p>Sinal: <span id="signal">--</span></p>
        <p class="score">Score IA: <span id="score">--</span></p>
    </div>
</div>

<!-- GRAFICO -->
<div id="chart" class="tab hidden">
    <div class="card">
        <h3>Gráfico</h3>
        <canvas id="chartCanvas"></canvas>
    </div>
</div>

<!-- MACRO -->
<div id="macro" class="tab hidden">
    <div class="card">
        <h3>Detector Macro</h3>
        <p>BTC: <span id="btc">--</span></p>
        <p>Ouro: <span id="gold">--</span></p>
        <p class="score">Risco: <span id="risk">--</span></p>
    </div>
</div>

</div>

<script>

const pairSelect = document.getElementById("pair");
let chart;

function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("active");
}

function showTab(tabId){
    document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));
    document.getElementById(tabId).classList.remove('hidden');
    toggleMenu();
}

async function loadPairs(){
    const res = await fetch("https://api.binance.com/api/v3/exchangeInfo");
    const data = await res.json();

    data.symbols
    .filter(s=>s.quoteAsset==="USDT" && s.status==="TRADING")
    .forEach(s=>{
        const opt=document.createElement("option");
        opt.value=s.symbol;
        opt.textContent=s.symbol;
        pairSelect.appendChild(opt);
    });
}

async function getData(pair){
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=15m&limit=100`);
    return await res.json();
}

function EMA(data,p){
    const k=2/(p+1);
    let ema=data[0];
    for(let i=1;i<data.length;i++) ema=data[i]*k+ema*(1-k);
    return ema;
}

function RSI(data,p){
    let g=0,l=0;
    for(let i=data.length-p;i<data.length-1;i++){
        let d=data[i+1]-data[i];
        d>0?g+=d:l+=Math.abs(d);
    }
    if(l===0) return 100;
    return 100-(100/(1+(g/l)));
}

async function analyze(){
    const pair=pairSelect.value;
    if(!pair) return;

    const raw=await getData(pair);
    const closes=raw.map(c=>parseFloat(c[4]));
    const price=closes.at(-1);

    document.getElementById("price").innerText=price.toFixed(4);

    const ema9=EMA(closes,9);
    const ema21=EMA(closes,21);
    const rsi=RSI(closes,14);

    let score=0;
    if(ema9>ema21) score+=40;
    if(rsi>60) score+=30;
    if(price>ema9) score+=30;

    let signal;
    if(score>70) signal='<span class="buy">COMPRA</span>';
    else if(score<40) signal='<span class="sell">VENDA</span>';
    else signal='<span class="neutral">AGUARDE</span>';

    document.getElementById("signal").innerHTML=signal;
    document.getElementById("score").innerText=score+"/100";

    renderChart(closes);
}

function renderChart(data){
    const ctx=document.getElementById("chartCanvas");

    if(chart) chart.destroy();

    chart=new Chart(ctx,{
        type:'line',
        data:{
            labels:data.map((_,i)=>i),
            datasets:[{data:data}]
        }
    });
}

async function macro(){
    const btc=await variation("BTCUSDT");
    const gold=await variation("PAXGUSDT");

    document.getElementById("btc").innerText=btc.toFixed(2)+"%";
    document.getElementById("gold").innerText=gold.toFixed(2)+"%";

    let risk="BAIXO";
    if(btc<-1 && gold>0.5) risk="MÉDIO";
    if(btc<-2 && gold>1) risk="ALTO";

    document.getElementById("risk").innerText=risk;
}

async function variation(symbol){
    const res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=2`);
    const d=await res.json();

    const prev=parseFloat(d[0][4]);
    const last=parseFloat(d[1][4]);

    return ((last-prev)/prev)*100;
}

pairSelect.addEventListener("change", analyze);

setInterval(()=>{
    analyze();
    macro();
},30000);

loadPairs();
analyze();
macro();

</script>

</body>
</html>
